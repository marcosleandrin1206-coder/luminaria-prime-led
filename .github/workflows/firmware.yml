name: Firmware SDK (exemplos)

on:
  push:
    paths:
      - "firmware-sdk/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Instalar cores ESP32 e ESP8266
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266 esp32:esp32

      - name: Compilar dosadora de 1 canal (PSF-B01 / ESP8285)
        run: |
          mkdir -p out
          arduino-cli compile --fqbn esp8266:esp8266:esp8285 \
            --library firmware-sdk/PrimeReefDevice \
            --output-dir build-rele \
            firmware-sdk/PrimeReefDevice/examples/DosadoraRele
          cp build-rele/DosadoraRele.ino.bin out/dosadora-rele-esp8285.bin

      - name: Compilar dosadora de 3 canais (ESP32)
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 \
            --library firmware-sdk/PrimeReefDevice \
            firmware-sdk/PrimeReefDevice/examples/Dosadora

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-dosadora
          path: out/*.bin
