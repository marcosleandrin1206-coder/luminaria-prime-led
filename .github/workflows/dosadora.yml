name: Firmware Dosadora

# Compila o firmware da dosadora a cada mudança. Na branch main, se o FW_NUM do código for maior que
# dosadora/version.txt, publica dosadora/bin/firmware-<FW_NUM>.bin e atualiza dosadora/version.txt:
# as dosadoras instaladas encontram a versão nova sozinhas (verificam a cada 6 h).

on:
  push:
    paths:
      - "dosadora/DosadoraPrimeReef/**"
      - "firmware-sdk/PrimeReefDevice/**"
      - ".github/workflows/dosadora.yml"
  pull_request:
    paths:
      - "dosadora/DosadoraPrimeReef/**"
      - "firmware-sdk/PrimeReefDevice/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dosadora-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Instalar core ESP8266
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Compilar (ESP12F_Relay_X1 · Generic ESP8266 · 4MB FS:2MB OTA:~1019KB)
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:generic:eesz=4M2M \
            --library firmware-sdk/PrimeReefDevice \
            --output-dir build-dosadora \
            dosadora/DosadoraPrimeReef
          ls -la build-dosadora

      - name: Ler versão do código
        id: v
        run: |
          N=$(grep -oP '^#define FW_NUM\s+\K[0-9]+' dosadora/DosadoraPrimeReef/DosadoraPrimeReef.ino)
          ATUAL=$(cat dosadora/version.txt 2>/dev/null | tr -dc '0-9')
          echo "num=$N" >> "$GITHUB_OUTPUT"
          echo "atual=${ATUAL:-0}" >> "$GITHUB_OUTPUT"
          echo "FW_NUM no código: $N · publicado: ${ATUAL:-0}"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-dosadora-v${{ steps.v.outputs.num }}
          path: build-dosadora/DosadoraPrimeReef.ino.bin

      - name: Publicar para atualização remota (somente main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && fromJSON(steps.v.outputs.num) > fromJSON(steps.v.outputs.atual)
        run: |
          N=${{ steps.v.outputs.num }}
          mkdir -p dosadora/bin
          cp build-dosadora/DosadoraPrimeReef.ino.bin "dosadora/bin/firmware-$N.bin"
          cp build-dosadora/DosadoraPrimeReef.ino.bin dosadora/firmware.bin
          echo "$N" > dosadora/version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # O binário vai no mesmo commit que o version.txt: a dosadora nunca vê uma versão sem o arquivo.
          git add dosadora/bin dosadora/firmware.bin dosadora/version.txt
          git commit -m "Publica firmware da dosadora v$N"
          git push

      - name: Link de download (release)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build-dosadora/DosadoraPrimeReef.ino.bin dosadora-prime-reef.bin
          gh release delete dosadora-latest --yes --cleanup-tag || true
          gh release create dosadora-latest dosadora-prime-reef.bin \
            --title "Firmware Dosadora Prime Reef v${{ steps.v.outputs.num }} (ESP12F_Relay_X1)" \
            --notes "Compilado do commit ${GITHUB_SHA::7}. Primeira gravação pela serial ou envio pela página da dosadora (aba Sistema)." \
            --prerelease \
            --target "$GITHUB_SHA"
