name: App Android

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: prime-reef-apk
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/apk/release/*.apk

      # Link fixo para baixar direto no celular:
      # https://github.com/<dono>/<repo>/releases/download/app-latest/PrimeReef.apk
      # (não afeta a atualização da luminária, que lê firmware.bin/version.txt da main)
      - name: Publicar APK para download direto
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk PrimeReef.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest PrimeReef.apk \
            --title "App Prime Reef Brasil (mais recente)" \
            --notes "APK gerado automaticamente do commit ${GITHUB_SHA::7}. Baixe o PrimeReef.apk e instale no Android." \
            --prerelease \
            --target "$GITHUB_SHA"

      # Capturas das telas do app com equipamentos simulados (não bloqueia o APK).
      - name: Gerar imagens das telas
        id: telas
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest -Ptelas --tests '*TelasTest*'

      - name: Publicar imagens das telas
        if: steps.telas.outcome == 'success' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la app/build/telas
          gh release delete app-telas --yes --cleanup-tag || true
          gh release create app-telas app/build/telas/*.png \
            --title "Telas do app Prime Reef (simuladas)" \
            --notes "Capturas geradas automaticamente com equipamentos simulados (commit ${GITHUB_SHA::7})." \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Guardar relatório dos testes de tela
        if: steps.telas.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-telas
          path: android-app/app/build/reports/tests/
